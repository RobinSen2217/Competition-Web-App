<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Earth observation explorer for Indian cities: vegetation and climate trends, with a disaster module." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Competition Web App</title>
    <!-- Fonts: Newsreader (headings), Figtree (body), DM Mono (numbers). Fallbacks are set in src/index.css. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <!-- Static copy of the boot loader (src/components/common/Loader.jsx), shown
         before any JS runs; React replaces it with the animated one. Same sizes,
         and colours matching the --bg / --muted / --accent / --accent-soft /
         --surface / --line tokens in src/index.css, light and dark. -->
    <style>
      .boot { --b: #eef3ec; --m: #566a5e; --a: #1f6b47; --as: #ddede2; --s: #ffffff; --l: #dce5dd;
        position: fixed; inset: 0; display: grid; place-items: center; padding: 0 16px; background: var(--b); color: var(--m); font: 15px/1.55 "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .boot { --b: #0f1713; --m: #9fb2a6; --a: #6cc598; --as: #1d3328; --s: #16201a; --l: #29382f; } }
      :root[data-theme="dark"] .boot { --b: #0f1713; --m: #9fb2a6; --a: #6cc598; --as: #1d3328; --s: #16201a; --l: #29382f; }
      .boot > div { display: flex; flex-direction: column; align-items: center; gap: 16px; }
      .boot p { margin: 0; }
      .boot-bar { display: block; width: 120px; height: 3px; border-radius: 9px; overflow: hidden; background: var(--l); }
      .boot-bar i { display: block; width: 40%; height: 100%; border-radius: 9px; background: var(--a); animation: boot-slide 1.2s ease-in-out infinite; }
      @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .boot-bar i { display: none; } }
    </style>
    <div id="root">
      <div class="boot" role="status">
        <div>
          <svg width="56" height="56" viewBox="0 0 30 30" aria-hidden="true">
            <circle cx="15" cy="15" r="14" fill="var(--as)" />
            <path d="M9 20c0-7 5-11 13-12-1 8-5 13-12 13" fill="var(--a)" />
            <path d="M10 21c3-4 6-7 10-10" stroke="var(--s)" stroke-width="1.4" fill="none" stroke-linecap="round" />
          </svg>
          <span class="boot-bar" aria-hidden="true"><i></i></span>
          <p>Loading satellite data…</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
