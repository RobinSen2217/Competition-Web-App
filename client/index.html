<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Earth observation explorer for Indian cities: vegetation and climate trends, with a disaster module." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Competition Web App</title>
    <!-- Fonts: Newsreader (headings), Figtree (body), DM Mono (numbers). Fallbacks are set in src/index.css. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <!-- Shown while main.jsx loads the data (API or bundled copy); React replaces it.
         Colours match the --bg / --muted tokens in src/index.css, light and dark. -->
    <style>
      .boot { min-height: 100vh; display: grid; place-items: center; margin: 0; background: #eef3ec; color: #566a5e; font: 15px system-ui, -apple-system, "Segoe UI", sans-serif; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .boot { background: #0f1713; color: #9fb2a6; } }
      :root[data-theme="dark"] .boot { background: #0f1713; color: #9fb2a6; }
    </style>
    <div id="root"><div class="boot" role="status">Loading data…</div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
