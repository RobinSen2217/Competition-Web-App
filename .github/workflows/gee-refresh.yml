# Monthly data refresh: runs the team's GEE notebook pipeline for every area
# (Earth Engine extraction -> physics features -> models -> 12-month forecast)
# and commits the results. The commit redeploys the website (Vercel) and the
# API (Render), which then serve the new data and forecasts.
#
# Needs an Earth Engine login as a repository secret (Settings > Secrets and
# variables > Actions). Either:
#   GEE_CREDENTIALS          contents of ~/.config/earthengine/credentials
#                            (personal login, after `earthengine authenticate`)
#   GEE_SERVICE_ACCOUNT_KEY  contents of a service-account JSON key
# and optionally the repository variable GEE_PROJECT (default miicproject2).
# Without a login the job stops early and changes nothing.
#
# Run by hand: Actions tab > "Monthly Earth Engine refresh" > Run workflow.

name: Monthly Earth Engine refresh

on:
  schedule:
    # 03:30 UTC on the 5th of every month, once most datasets have the previous month
    - cron: '30 3 5 * *'
  workflow_dispatch:
    inputs:
      area:
        description: 'One area id (e.g. jaisalmer), or empty for all'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: gee-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GEE_PROJECT: ${{ vars.GEE_PROJECT || 'miicproject2' }}
      GEE_CREDENTIALS: ${{ secrets.GEE_CREDENTIALS }}
      HAS_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY != '' }}
      HAS_LOGIN: ${{ secrets.GEE_CREDENTIALS != '' || secrets.GEE_SERVICE_ACCOUNT_KEY != '' }}
      # Use the runner's Python (with the pinned requirements) instead of a venv
      FORECAST_PYTHON: python
    steps:
      - name: No Earth Engine login configured
        if: env.HAS_LOGIN != 'true'
        run: echo "::warning::Add the GEE_CREDENTIALS or GEE_SERVICE_ACCOUNT_KEY secret to enable the refresh. Nothing was changed."

      - uses: actions/checkout@v4
        if: env.HAS_LOGIN == 'true'

      - uses: actions/setup-python@v5
        if: env.HAS_LOGIN == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/ml/requirements.txt

      - uses: actions/setup-node@v4
        if: env.HAS_LOGIN == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        if: env.HAS_LOGIN == 'true'
        run: |
          pip install -r server/ml/requirements.txt
          npm ci --prefix server

      - name: Service-account key from secret
        if: env.HAS_LOGIN == 'true' && env.HAS_KEY == 'true'
        env:
          KEY_JSON: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
        run: |
          mkdir -p server/secrets
          printf '%s' "$KEY_JSON" > server/secrets/gee-key.json
          echo "GEE_SERVICE_ACCOUNT_KEY=secrets/gee-key.json" >> "$GITHUB_ENV"

      - name: Check the Earth Engine login
        if: env.HAS_LOGIN == 'true'
        run: npm run gee:check --prefix server

      - name: Extract from Earth Engine (notebook steps 6-18)
        if: env.HAS_LOGIN == 'true'
        env:
          AREA: ${{ github.event.inputs.area }}
        run: |
          cd server
          if [ -n "$AREA" ]; then node scripts/gee.js extract --area "$AREA"; else npm run gee:extract; fi

      - name: Train the models and save forecasts (notebook steps 19-23)
        if: env.HAS_LOGIN == 'true'
        run: npm run forecasts:build --prefix server

      - name: Commit the new data
        if: env.HAS_LOGIN == 'true'
        run: |
          rm -rf server/secrets
          git add server/data/gee server/data/forecasts client/public/data/forecasts
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Data: Earth Engine refresh $(date -u +%Y-%m)"
          git push
